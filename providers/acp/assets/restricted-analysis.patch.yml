# ShiShi restricted analysis profile overlay for the shipped dsh `acp` profile.
#
# This is applied with `dsh --profile acp --patch <this file>` so the user's
# global profile is never modified. It disables every built-in tool/network/
# skill/instruction plugin. The only tools that can reach the model are the
# per-session ACP MCP servers supplied by the caller (ShiShi read-only analysis
# MCP and the submit_analysis MCP server).
#
# The app verifies the composed `--dump-config` output against an allowlist and
# fails closed if this overlay is not in effect or an unknown active entry
# appears. Keep this file synchronized with `src/restricted.rs`.

- id: plugin-manager
  disabled: true
- id: tool-plugin-manager
  disabled: true
- id: hmr
  disabled: true
- id: config-editor
  disabled: true
- id: settings
  disabled: true

# Working directory is provided as session context, but the model cannot
# change it.
- id: tool-working-directory
  disabled: true

# No shell, filesystem, job, web, skill, instruction, goal, plan, command,
# subagent, workflow, or generic MCP-resource surface.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: true
