
[package]
name = "shishi-acp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "shishi_acp"
path = "src/lib.rs"

[dependencies]
shishi-api = { path = "../api" }
serde_json = "1"
thiserror = "2"
yaml_serde = "0.10.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

# Synthetic test agents; `cargo test` builds them beside the integration tests.
[[example]]
name = "mock_agent"
path = "tests/support/mock_agent.rs"

[[example]]
name = "submit_mcp"
path = "tests/support/submit_mcp.rs"
