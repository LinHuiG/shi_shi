[package]
name = "shishi-api"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
serde_json = "1"
serde = "1"
thiserror = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls-no-alpn"] }
native-tls = "0.2.16"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[features]
# Test builds only: accept plain http to loopback (see http_client).
loopback-http = ["tokio/rt-multi-thread"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
