[package]
name = "shishi"
version = "1.2.3"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/LinHuiG/shi_shi"

[dependencies]
base64 = "0.22.1"
shishi-api = { path = "providers/api" }
shishi-acp = { path = "providers/acp" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
wry = "0.53"
tao = "0.34"
rfd = "0.15"
fs2 = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
windows-sys = { version = "0.59.0", features = ["Win32_Networking_WinHttp", "Win32_Foundation", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Controls"] }

[profile.release]
opt-level = "s"
strip = true

[patch.crates-io]
wry = { path = "vendor/wry" }


[workspace]
members = ["providers/api", "providers/acp", "plugin-sdk", "examples/json-source"]
