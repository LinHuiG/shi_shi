[workspace]
resolver = "2"
members = ["core", "app", "providers/api", "providers/acp", "plugin-sdk", "examples/json-source"]

[workspace.package]
version = "1.2.6"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
miniz_oxide = "0.8.9"
crc32fast = "1.5.3"
base64 = "0.22.1"

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
codegen-units = 1

[patch.crates-io]
wry = { path = "vendor/wry" }
