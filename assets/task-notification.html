<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';base-uri 'none';form-action 'none'"><title>拾事 · 事项更新</title>
<style>
/* THEME */
*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;height:100vh;overflow:hidden;position:relative;border:1px solid var(--hairline-strong);border-radius:8px;background:var(--bg);color:var(--text);font:13px/1.5 'Segoe UI','Microsoft YaHei UI',sans-serif;transition:background-color 120ms ease}body:has(#open:hover){background:var(--panel)}#open{display:flex;flex-direction:column;gap:8px;width:100%;height:100%;padding:12px 14px;color:inherit;text-decoration:none;cursor:pointer}header{display:flex;align-items:center;gap:7px;height:18px;flex:none;padding-right:22px;color:var(--text-secondary);font-size:12px}.brand{display:flex;align-items:center;color:var(--text-muted)}.brand svg{width:16px;height:16px}header small{font:inherit;color:var(--text-muted)}#dismiss{position:absolute;right:7px;top:7px;width:24px;height:24px;padding:0;background:transparent;border:0;border-radius:5px;color:var(--text-muted);font:19px/1 'Segoe UI',sans-serif;cursor:pointer}#dismiss:hover{background:var(--g5);color:var(--text)}main{min-height:0}h1,p{margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}h1{font-size:13px;line-height:20px;font-weight:600;-webkit-line-clamp:2}p{margin-top:4px;font-size:12px;line-height:18px;color:var(--text-secondary);-webkit-line-clamp:2}#open:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}#dismiss:focus-visible{outline:2px solid var(--accent);outline-offset:1px}@media(prefers-reduced-motion:reduce){body{transition:none}}
</style></head><body><a id="open" href="#" aria-label="查看事项"><header><span class="brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="m12 3 10 5-10 5L2 8Zm-10 9 10 5 10-5M2 16l10 5 10-5"/></svg></span><span>拾事</span><small>· 事项更新</small></header><main><h1></h1><p></p></main></a><button id="dismiss" aria-label="关闭提醒" title="关闭提醒">×</button>
<script>
let current=null;
const send=action=>window.ipc.postMessage(JSON.stringify({action,id:current?.id||''}));
window.setNotice=notice=>{current=notice;const title=document.querySelector('h1'),summary=document.querySelector('p');title.textContent=notice.title;title.title=notice.title;summary.textContent=notice.summary;summary.title=notice.summary;document.querySelector('#open').setAttribute('aria-label','查看事项：'+notice.title);requestAnimationFrame(()=>requestAnimationFrame(()=>send('presented')));};
document.querySelector('#dismiss').onclick=()=>send('dismiss');document.querySelector('#open').onclick=e=>{e.preventDefault();if(current)send('open')};document.querySelector('#open').onkeydown=e=>{if(e.key===' '){e.preventDefault();e.currentTarget.click()}};document.addEventListener('keydown',e=>{if(e.key==='Escape')send('dismiss')});send('ready');
</script></body></html>
