<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';base-uri 'none';form-action 'none'"><title>拾事 · 事项更新</title>
<style>
/* THEME */
*{box-sizing:border-box}html{height:100%;background:var(--bg)}body{margin:0;height:100vh;overflow:hidden;border:1px solid var(--g7);border-radius:8px;background:var(--bg);color:var(--text);font:13px/1.5 'Segoe UI','Microsoft YaHei UI',sans-serif;display:flex;flex-direction:column;padding:10px 14px 10px;gap:10px}header{display:flex;align-items:center;gap:7px;min-height:22px;color:var(--text-secondary);font-size:12px}.brand{display:grid;place-items:center;width:17px;height:17px;border-radius:4px;background:var(--g13);color:var(--g3);font-size:11px;font-weight:700}header small{color:var(--dim);font-size:11px;margin-left:auto}button{font:inherit;color:var(--text);cursor:pointer;border-radius:4px}#dismiss{width:24px;height:24px;margin:-3px -5px -3px 0;padding:0;background:transparent;border:0;color:var(--sub);font-size:19px;line-height:1}#dismiss:hover{background:var(--g5);color:var(--text)}main{flex:1;min-height:0}h1,p{margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}h1{font-size:14px;line-height:20px;font-weight:600;-webkit-line-clamp:2}p{margin-top:5px;font-size:13px;line-height:19px;color:var(--text-secondary);-webkit-line-clamp:2}#open{width:100%;height:30px;flex:none;background:var(--g5);border:1px solid var(--hairline-strong);font-size:12px}#open:hover{background:var(--g6)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><header><span class="brand" aria-hidden="true">拾</span><span>拾事</span><small>5 分钟后关闭</small><button id="dismiss" aria-label="关闭提醒" title="关闭提醒">×</button></header><main><h1></h1><p></p></main><button id="open">查看事项</button>
<script>
let current=null;
const send=action=>window.ipc.postMessage(JSON.stringify({action,id:current?.id||''}));
window.setNotice=notice=>{current=notice;const title=document.querySelector('h1'),summary=document.querySelector('p');title.textContent=notice.title;title.title=notice.title;summary.textContent=notice.summary;requestAnimationFrame(()=>requestAnimationFrame(()=>send('presented')));};
document.querySelector('#dismiss').onclick=()=>send('dismiss');document.querySelector('#open').onclick=()=>{if(current)send('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')send('dismiss')});send('ready');
</script></body></html>
