<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';style-src 'unsafe-inline';script-src 'unsafe-inline';base-uri 'none';form-action 'none'"><title>拾事</title>
<style>
/* THEME */
*{box-sizing:border-box}html{height:100%;background:var(--surface)}
body{margin:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--hairline-strong);border-radius:var(--r-lg);background:var(--surface);color:var(--text);font:var(--fs-body)/var(--lh-body) 'Segoe UI Variable Text','Segoe UI','Microsoft YaHei UI',sans-serif;user-select:none}
button{font:inherit;color:inherit;background:transparent;border:0;border-radius:var(--r-sm);cursor:pointer}
button:hover:not(:disabled){background:var(--surface-active)}button:active:not(:disabled){background:var(--surface-pressed)}button:disabled{color:var(--text-muted);cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
header{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-3) var(--sp-2) var(--sp-4);flex:none}
header b{font-size:var(--fs-body);font-weight:600}
.chip{padding:0 var(--sp-2);border-radius:var(--r-pill);background:var(--surface-raised);color:var(--text-secondary);font-size:var(--fs-caption);line-height:20px}
.chip.on{background:var(--green-bg);color:var(--green-fg)}
.icon{display:grid;place-items:center;width:var(--control-h);height:var(--control-h);margin-left:auto;color:var(--text-secondary)}.icon svg{width:16px;height:16px}
section{margin:0 var(--sp-3) var(--sp-2);padding:var(--sp-3);border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface-layer);flex:none}
.label{color:var(--text-secondary);font-size:var(--fs-caption);line-height:var(--lh-caption)}
#ai p{margin:var(--sp-1) 0 0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere}
#ai .error{color:var(--red-fg)}
#inbox{display:flex;align-items:center;gap:var(--sp-2)}#inbox span{flex:1}
.primary{height:var(--control-h-sm);padding:0 var(--sp-3);background:var(--accent);color:var(--on-accent);font-size:var(--fs-caption)}
.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}.primary:disabled{background:var(--surface-raised)}
#tasks{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp-2) 0 0}
#tasks .head{display:flex;gap:var(--sp-2);align-items:baseline;padding:0 var(--sp-3) var(--sp-1)}#tasks .head span:last-child{margin-left:auto}
ul{list-style:none;margin:0;padding:0 0 var(--sp-1);overflow-y:auto;flex:1}
li button{display:flex;gap:var(--sp-2);align-items:baseline;width:100%;padding:var(--sp-2) var(--sp-3);text-align:left}
li .n{flex:none;min-width:2.5em;color:var(--text-muted);font-size:var(--fs-caption);font-variant-numeric:tabular-nums}
li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .s{flex:none;color:var(--text-secondary);font-size:var(--fs-caption)}li .s.due{color:var(--amber-fg)}
.empty{padding:var(--sp-4) var(--sp-3);color:var(--text-muted);text-align:center}
footer{flex:none;padding:var(--sp-2) var(--sp-3) var(--sp-3);border-top:1px solid var(--hairline)}
footer button{width:100%;height:var(--control-h);background:var(--surface-raised)}
</style></head><body>
<header><b>拾事</b><span class="chip" id="work"></span><button class="icon" id="full" title="打开拾事" aria-label="打开拾事"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 2.5h4.5V7M13.5 2.5 8 8M7 3.5H4A1.5 1.5 0 0 0 2.5 5v7A1.5 1.5 0 0 0 4 13.5h7a1.5 1.5 0 0 0 1.5-1.5V9"/></svg></button></header>
<section id="ai" aria-live="polite"><div class="label" id="ai-label"></div><p id="ai-text"></p></section>
<section id="inbox"><span id="pending"></span><button class="primary" id="analyze">立即分析</button></section>
<section id="tasks"><div class="head"><span class="label">待跟进</span><span class="label" id="counts"></span></div><ul id="list"></ul></section>
<footer><button id="open">打开完整窗口</button></footer>
<script>
const $=s=>document.querySelector(s),pending=new Map();let seq=0,loading=false,again=false;
const send=(method,params={})=>window.ipc.postMessage(JSON.stringify({method,params}));
const rpc=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});window.ipc.postMessage(JSON.stringify({id,method,params}))});
window.chrome?.webview?.addEventListener('message',e=>{const v=e.data,p=pending.get(v.id);if(!p)return;pending.delete(v.id);v.ok?p.resolve(v.data):p.reject(Error(v.error))});
const work={working:'工作中',overtime:'加班中',off_duty:'已下班',holiday:'假期',calendar_unknown:'日历未知'};
const time=t=>new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const last=t=>String(t||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).at(-1)||'';
function render(s,rows){
  const ws=s.work_state;$('#work').textContent=ws?work[ws.status]||ws.status:'日历未就绪';$('#work').classList.toggle('on',['working','overtime'].includes(ws?.status));
  $('#ai-label').textContent=s.ai_busy?(s.analyzing?`AI 正在分析 ${s.analyzing} 条消息`:'AI 正在处理'):`最近事项分析 ${s.last_analysis_success_at?time(s.last_analysis_success_at):'尚未分析'}`;
  const text=$('#ai-text');text.className=!s.ai_busy&&s.last_error?'error':'';
  text.textContent=s.ai_busy?last((s.ai_live?.entries||[]).at(-1)?.text||s.ai_live?.phase||s.ai_progress)||'等待公开内容':s.last_error?`处理失败：${s.last_error}`:'';text.hidden=!text.textContent;
  $('#pending').textContent=s.analyzing?`${s.analyzing} 条分析中`:s.pending?`${s.pending} 条消息等待分析`:'没有等待分析的消息';
  $('#analyze').disabled=!s.pending||s.ai_busy||!!s.analyzing;
  const c=s.task_focus_counts||{};$('#counts').textContent=`待处理 ${c['待处理']||0} · 处理中 ${c['处理中']||0} · 被阻塞 ${c['被阻塞']||0}`;
  const list=$('#list');
  if(!rows.length){list.innerHTML='<li class="empty">没有需要跟进的事项</li>';return}
  const empty=list.querySelector('.empty');if(empty)empty.remove();
  for(const [i,r] of rows.slice(0,20).entries()){
    let li=list.children[i];
    if(!li){li=document.createElement('li');li.innerHTML='<button><span class="n"></span><span class="t"></span><span class="s"></span></button>';list.append(li)}
    const b=li.firstElementChild;b.dataset.id=r.id;b.title=r.title;
    b.children[0].textContent='#'+r.number;b.children[1].textContent=r.title;
    b.children[2].textContent=r.due||r.status;b.children[2].classList.toggle('due',!!r.due)}
  while(list.children.length>Math.min(rows.length,20))list.lastElementChild.remove();
}
async function load(){
  if(loading){again=true;return}loading=true;
  try{do{again=false;const[s,t]=await Promise.all([rpc('state',{page:'panel'}),rpc('active_tasks_query',{scope:'未完成'})]);render(s,t.rows)}while(again)}
  catch(e){$('#ai-label').textContent='读取失败';$('#ai-text').textContent=e.message;$('#ai-text').hidden=false}
  finally{loading=false}
}
window.panelShown=load;window.stateChanged=load;
$('#list').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)send('panel_open',{id:b.dataset.id})};
$('#open').onclick=$('#full').onclick=()=>send('panel_open');
$('#analyze').onclick=async()=>{const b=$('#analyze');b.disabled=true;try{await rpc('ai_job_start',{method:'analyze',params:{}})}catch(e){$('#ai-text').textContent=e.message;$('#ai-text').className='error';$('#ai-text').hidden=false;b.disabled=false}};
document.addEventListener('keydown',e=>{if(e.key==='Escape')send('panel_hide');
  if(['ArrowDown','ArrowUp'].includes(e.key)){const all=[...document.querySelectorAll('#list button,#open')],i=all.indexOf(document.activeElement);all[(i+(e.key==='ArrowDown'?1:all.length-1))%all.length]?.focus();e.preventDefault()}});
document.addEventListener('contextmenu',e=>e.preventDefault());
send('panel_ready');
</script></body></html>
